[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "negao-ai-backend"
version = "0.1.0"
description = "Sophie AI - Fundação (v0.x): esqueleto funcional da API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "pgvector==0.5.0",
    "structlog==26.1.0",
    "orjson==3.12.0",
    "httpx==0.28.1",
    "pyjwt==2.15.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "prometheus-client==0.26.0",
    "edge-tts==7.2.8",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-redis==4.6.0.20241004",
    "fakeredis==2.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "pydantic_settings.*",
    "starlette.*",
    "uvicorn.*",
    "structlog.*",
    "prometheus_client.*",
    "sqlalchemy.*",
    "asyncpg.*",
    "alembic.*",
    "redis.*",
    "pgvector.*",
    "orjson.*",
    "httpx.*",
    "jwt.*",
    "opentelemetry.*",
    "edge_tts.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: testes que exigem PostgreSQL/Redis reais (requerem NEGAO_TEST_DATABASE_URL)",
]
