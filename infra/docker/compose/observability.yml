name: negao-observability

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "9091:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command:
      - --config
      - >-
        yaml:receivers::otlp::protocols::grpc::endpoint=0.0.0.0:4317;receivers::otlp::protocols::http::endpoint=0.0.0.0:4318;receivers::prometheus::config::scrape_configs=[{job_name:otel-collector,static_configs:[{targets:[localhost:8888]}]}];exporters::prometheus::endpoint=0.0.0.0:8889;exporters::debug::verbosity=basic;processors::batch::timeout=5s;service::pipelines::metrics::receivers=[otlp,prometheus];service::pipelines::metrics::processors=[batch];service::pipelines::metrics::exporters=[prometheus,debug]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
