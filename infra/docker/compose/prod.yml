name: negao-prod

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-negao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-negao}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negao} -d ${POSTGRES_DB:-negao}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
          pids: 128

  backend:
    build:
      context: ../../../backend
    env_file:
      - ../../../.env
    environment:
      NEGAO_ENV: production
      NEGAO_REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
      SOPHIE_INTERNAL_PROXY_KEY: ${SOPHIE_INTERNAL_PROXY_KEY:?defina SOPHIE_INTERNAL_PROXY_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    init: true
    networks:
      - app
      - data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256

  frontend:
    build:
      context: ../../../frontend
    restart: unless-stopped
    environment:
      NEGAO_API_URL: http://backend:8000
      SOPHIE_INTERNAL_PROXY_KEY: ${SOPHIE_INTERNAL_PROXY_KEY:?defina SOPHIE_INTERNAL_PROXY_KEY}
      SOPHIE_PUBLIC_ORIGIN: ${SOPHIE_PUBLIC_ORIGIN:?defina SOPHIE_PUBLIC_ORIGIN}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m
    init: true
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 128

  nginx:
    build:
      context: ../../nginx
    environment:
      SOPHIE_HOST: ${SOPHIE_HOST:?defina SOPHIE_HOST}
      NGINX_ENVSUBST_FILTER: "^SOPHIE_HOST$"
    volumes:
      - ${TLS_CERT_PATH:?defina TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?defina TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 128

volumes:
  pgdata:
  redis-data:

networks:
  app:
  data:
    internal: true
