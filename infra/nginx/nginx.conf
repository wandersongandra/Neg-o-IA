user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=sophie_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=sophie_login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=sophie_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Do not log query strings: WebSocket tickets are intentionally short-lived
    # credentials and must never end up in access logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
