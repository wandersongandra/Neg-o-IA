name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: negao
          POSTGRES_PASSWORD: negao-ci-password
          POSTGRES_DB: negao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U negao -d negao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend

      - name: Formatter (ruff)
        run: ruff format --check backend

      - name: Static security analysis (Semgrep)
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --error --metrics off backend/app

      - name: Typecheck (mypy)
        run: mypy backend

      - name: Testes (pytest)
        run: pytest backend/tests -q

      - name: Migrations (PostgreSQL limpo)
        env:
          NEGAO_ENV: test
          NEGAO_DATABASE_URL: postgresql+asyncpg://negao:negao-ci-password@127.0.0.1:5432/negao
          NEGAO_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          cd backend
          python -m alembic -c migrations/alembic.ini upgrade head
          python -m alembic -c migrations/alembic.ini current

      - name: Dependency audit (Python)
        run: |
          python -m pip install pip-audit
          pip-audit

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ]; then
            npm run lint
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit (produção)
        run: npm audit --omit=dev --audit-level=high

  secret_scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
