name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend

      - name: Typecheck (mypy)
        run: mypy backend

      - name: Testes (pytest)
        run: pytest backend/tests -q

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (se configurado)
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ]; then
            npm run lint
          fi

      - name: Build
        run: npm run build
