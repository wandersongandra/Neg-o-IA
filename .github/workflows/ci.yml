name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: negao
          POSTGRES_PASSWORD: negao-ci-password
          POSTGRES_DB: negao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U negao -d negao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact Python direct dependency pins
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          groups = {
              "runtime": payload["project"]["dependencies"],
              "dev": payload["project"]["optional-dependencies"]["dev"],
          }
          unpinned = [
              f"{group}:{dependency}"
              for group, dependencies in groups.items()
              for dependency in dependencies
              if "==" not in dependency
          ]
          if unpinned:
              raise SystemExit("Unpinned direct Python dependencies: " + ", ".join(unpinned))
          PY

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend

      - name: Formatter (ruff)
        run: ruff format --check backend

      - name: Static security analysis (Semgrep)
        run: |
          python -m pip install "semgrep==1.178.0"
          semgrep scan --config p/python --error --metrics off backend/app

      - name: Typecheck (mypy)
        run: mypy backend

      - name: Testes (pytest)
        env:
          NEGAO_ENV: test
          NEGAO_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest backend/tests -q

      - name: Migrations (PostgreSQL limpo)
        env:
          NEGAO_ENV: test
          NEGAO_DATABASE_URL: postgresql+asyncpg://negao:negao-ci-password@127.0.0.1:5432/negao
          NEGAO_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          cd backend
          python -m alembic -c migrations/alembic.ini upgrade head
          python -m alembic -c migrations/alembic.ini current

      - name: Dependency audit (Python)
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ]; then
            npm run lint
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit (produção)
        run: npm audit --omit=dev --audit-level=high


  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: pip

      - name: Generate backend SBOM
        run: |
          mkdir -p sbom
          python -m venv /tmp/sophie-sbom-env
          /tmp/sophie-sbom-env/bin/pip install -e "backend"
          pip install "cyclonedx-bom==7.4.0"
          cyclonedx-py environment /tmp/sophie-sbom-env/bin/python --spec-version 1.6 --output-format JSON --output-reproducible --pyproject backend/pyproject.toml --output-file sbom/backend.cdx.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate frontend SBOM
        run: |
          npm ci --prefix frontend
          cd frontend
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --ignore-npm-errors --output-reproducible --spec-version 1.6 --output-format JSON --output-file ../sbom/frontend.cdx.json

      - name: Validate SBOM payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("backend.cdx.json", "frontend.cdx.json"):
              path = Path("sbom") / name
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("bomFormat") == "CycloneDX", name
              assert payload.get("specVersion") == "1.6", name
              assert payload.get("components"), name
          PY
          sha256sum sbom/*.cdx.json > sbom/SHA256SUMS

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sophie-sbom
          path: |
            sbom/backend.cdx.json
            sbom/frontend.cdx.json
            sbom/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Attest SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@a0eb68d51f3a5d373e107cfa9c8455ba800479cd
        with:
          subject-path: |
            sbom/backend.cdx.json
            sbom/frontend.cdx.json
            sbom/SHA256SUMS
  infrastructure:
    name: Infra (Nginx config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate production Compose topology
        env:
          SOPHIE_PUBLIC_ORIGIN: https://sophie.example.test
          SOPHIE_HOST: sophie.example.test
          TLS_CERT_PATH: /tmp/sophie-tls/fullchain.pem
          TLS_KEY_PATH: /tmp/sophie-tls/privkey.pem
        run: |
          touch .env
          install -d -m 700 secrets
          printf '%s\n' 'ci-postgres-password-strong' > secrets/postgres_password
          printf '%s\n' 'ci-redis-password-strong' > secrets/redis_password
          printf '%s\n' 'postgresql+asyncpg://negao:ci-postgres-password-strong@db:5432/negao' > secrets/database_url
          printf '%s\n' 'redis://:ci-redis-password-strong@redis:6379/0' > secrets/redis_url
          printf '%s\n' 'ci-app-secret-key-0123456789abcdef0123456789' > secrets/app_secret_key
          printf '%s\n' 'ci-internal-proxy-key-0123456789abcdef012345' > secrets/internal_proxy_key
          chmod 600 secrets/*
          docker compose -f infra/docker/compose/prod.yml config > /tmp/sophie-prod-compose.yml
          test "$(grep -c 'read_only: true' /tmp/sophie-prod-compose.yml)" -ge 3
          grep -q '/app/.next/cache' /tmp/sophie-prod-compose.yml
          grep -q '/var/cache/nginx' /tmp/sophie-prod-compose.yml
          grep -q '/etc/nginx/conf.d' /tmp/sophie-prod-compose.yml
          grep -q '/run/secrets/internal_proxy_key' /tmp/sophie-prod-compose.yml
          grep -q '/run/secrets/app_secret_key' /tmp/sophie-prod-compose.yml
          grep -q '/run/secrets/database_url' /tmp/sophie-prod-compose.yml
          grep -q '/run/secrets/redis_url' /tmp/sophie-prod-compose.yml
          grep -q 'SOPHIE_PUBLIC_ORIGIN' /tmp/sophie-prod-compose.yml
          ! grep -q 'SOPHIE_INTERNAL_PROXY_KEY:' /tmp/sophie-prod-compose.yml
          grep -q 'SOPHIE_HOST' /tmp/sophie-prod-compose.yml
          grep -q '/tmp' /tmp/sophie-prod-compose.yml
          rm -rf .env secrets

      - name: Verify immutable image pins
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path("/tmp/sophie-prod-compose.yml").read_text(encoding="utf-8")
          assert compose.count("@sha256:") >= 2

          expected = {
              "backend/Dockerfile": 1,
              "frontend/Dockerfile": 2,
              "infra/nginx/Dockerfile": 1,
          }
          for file_name, count in expected.items():
              lines = Path(file_name).read_text(encoding="utf-8").splitlines()
              pinned = [line for line in lines if line.startswith("FROM ") and "@sha256:" in line]
              assert len(pinned) == count, (file_name, pinned)
          PY

      - name: Build Nginx image
        run: docker build -t sophie-nginx-ci infra/nginx

      - name: Generate ephemeral TLS certificate
        run: openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -keyout /tmp/privkey.pem -out /tmp/fullchain.pem

      - name: Validate Nginx configuration
        run: docker run --rm -e SOPHIE_HOST=sophie.example.test --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -v /tmp/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro -v /tmp/privkey.pem:/etc/nginx/tls/privkey.pem:ro sophie-nginx-ci nginx -t

      - name: Verify Nginx host allowlist rendering
        run: docker run --rm -e SOPHIE_HOST=sophie.example.test --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -v /tmp/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro -v /tmp/privkey.pem:/etc/nginx/tls/privkey.pem:ro sophie-nginx-ci nginx -T 2>&1 | grep -Fq 'server_name sophie.example.test;'
  secret_scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv_review:
    name: OSV dependency review
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c7c7bcb0773cc4678a674ada03a66cc5c4325476
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
