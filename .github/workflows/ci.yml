name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: negao
          POSTGRES_PASSWORD: negao-ci-password
          POSTGRES_DB: negao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U negao -d negao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend

      - name: Formatter (ruff)
        run: ruff format --check backend

      - name: Static security analysis (Semgrep)
        run: |
          python -m pip install "semgrep==1.178.0"
          semgrep scan --config p/python --error --metrics off backend/app

      - name: Typecheck (mypy)
        run: mypy backend

      - name: Testes (pytest)
        env:
          NEGAO_ENV: test
          NEGAO_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest backend/tests -q

      - name: Migrations (PostgreSQL limpo)
        env:
          NEGAO_ENV: test
          NEGAO_DATABASE_URL: postgresql+asyncpg://negao:negao-ci-password@127.0.0.1:5432/negao
          NEGAO_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          cd backend
          python -m alembic -c migrations/alembic.ini upgrade head
          python -m alembic -c migrations/alembic.ini current

      - name: Dependency audit (Python)
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ]; then
            npm run lint
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit (produção)
        run: npm audit --omit=dev --audit-level=high


  infrastructure:
    name: Infra (Nginx config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate production Compose topology
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          TLS_CERT_PATH: /tmp/sophie-tls/fullchain.pem
          TLS_KEY_PATH: /tmp/sophie-tls/privkey.pem
        run: |
          touch .env
          docker compose -f infra/docker/compose/prod.yml config > /tmp/sophie-prod-compose.yml
          rm -f .env

      - name: Build Nginx image
        run: docker build -t sophie-nginx-ci infra/nginx

      - name: Generate ephemeral TLS certificate
        run: |
          mkdir -p /tmp/sophie-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout /tmp/sophie-tls/privkey.pem \
            -out /tmp/sophie-tls/fullchain.pem

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -v /tmp/sophie-tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro \
            -v /tmp/sophie-tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro \
            sophie-nginx-ci nginx -t

  secret_scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv_review:
    name: OSV dependency review
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c7c7bcb0773cc4678a674ada03a66cc5c4325476
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
