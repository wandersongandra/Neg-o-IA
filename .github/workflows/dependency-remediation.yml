name: One-time Frontend Dependency Remediation

on:
  push:
    branches: [security/frontend-dependency-remediation]

concurrency:
  group: sophie-frontend-dependency-remediation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/frontend-dependency-remediation

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from patched package manifest
        run: npm install

      - name: Validate lint
        run: npm run lint

      - name: Validate build
        run: npm run build

      - name: Validate typecheck
        run: npm run typecheck

      - name: Enforce production audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Remove one-time workflow and commit dependency remediation
        working-directory: .
        run: |
          rm .github/workflows/dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): patch Next.js and Sharp vulnerabilities"
          git push origin HEAD:security/frontend-dependency-remediation
